name: Refresh profile README

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-readme.mjs
      - scripts/build-readme.test.mjs
      - .github/workflows/readme.yml

permissions:
  contents: write

concurrency:
  group: readme
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Test the generator
        run: node --test scripts/

      - name: Rebuild the catalog section from maecly.com/catalog.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-readme.mjs

      - name: Commit if the README changed
        run: |
          if git diff --quiet -- profile/README.md; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          git commit -m "docs(profile): refresh the product catalog from maecly.com"
          git push
